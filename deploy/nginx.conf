# EduM — Nginx reverse proxy (standard Linux server)
#
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/edum
#           sudo ln -s /etc/nginx/sites-available/edum /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:      sudo certbot --nginx -d school.example.com   (recommended)
#
# Routing: /api/* goes straight to the NestJS API (bypassing Next.js for
# throughput); everything else goes to the Next.js server.

upstream edum_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream edum_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name school.example.com;   # ← change to your domain (or _ for any)

    # uploads (student documents, homework attachments) — API limit is 10 MB
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # security headers (mirrors the app-level headers for non-app responses)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── API ──
    location /api/ {
        proxy_pass http://edum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ── Next.js static assets (immutable, cache hard) ──
    location /_next/static/ {
        proxy_pass http://edum_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Web app ──
    location / {
        proxy_pass http://edum_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
